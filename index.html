<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Claude AI</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial;background:#f0f0f0;padding:20px}
        .container{max-width:1000px;margin:0 auto;background:white;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.1);overflow:hidden}
        .header{background:#6C63FF;color:white;padding:20px 30px}
        .header h1{font-size:28px}
        .tabs{display:flex;background:#f5f5f5;border-bottom:2px solid #ddd}
        .tab-btn{flex:1;padding:15px;border:none;background:none;font-size:16px;cursor:pointer;font-weight:bold;color:#666}
        .tab-btn:hover{background:#e8e8e8}
        .tab-btn.active{background:white;color:#6C63FF;border-bottom:3px solid #6C63FF}
        .tab-content{padding:30px}
        .tab-pane{display:none}
        .tab-pane.active{display:block}
        .chat-box{border:1px solid #ddd;border-radius:10px;height:400px;overflow-y:auto;padding:15px;margin-bottom:15px;background:#fafafa}
        .msg{margin:10px 0;padding:10px 15px;border-radius:10px;max-width:80%}
        .msg.user{background:#6C63FF;color:white;margin-left:auto}
        .msg.assistant{background:#e8e8e8;color:#333}
        .chat-input{display:flex;gap:10px}
        .chat-input input{flex:1;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:16px}
        .chat-input button{padding:12px 30px;background:#6C63FF;color:white;border:none;border-radius:8px;cursor:pointer;font-size:16px}
        .chat-input button:hover{background:#5a52e0}
        .upload-area{border:3px dashed #ddd;border-radius:15px;padding:40px;text-align:center;cursor:pointer}
        .upload-area:hover{border-color:#6C63FF;background:#f9f9ff}
        .upload-area input{display:none}
        .upload-icon{font-size:50px}
        .results{margin-top:20px;padding:20px;background:#f9f9f9;border-radius:10px;display:none}
        .results.show{display:block}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:20px}
        .stat-card{background:white;padding:15px;border-radius:10px;text-align:center}
        .stat-number{font-size:28px;font-weight:bold;color:#6C63FF}
        .analysis-text{background:white;padding:20px;border-radius:10px;line-height:1.6;white-space:pre-wrap}
        .loading{display:none;text-align:center;padding:20px}
        .loading.show{display:block}
        .spinner{border:4px solid #f3f3f3;border-top:4px solid #6C63FF;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .download-btn{display:inline-block;padding:12px 30px;background:#6C63FF;color:white;text-decoration:none;border-radius:8px;font-weight:bold}
        .download-btn:hover{background:#5a52e0}
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h1>Claude AI</h1><p>Chat or analyze CSV</p></div>
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('chat')">Chat</button>
        <button class="tab-btn" onclick="openTab('analiza')">CSV</button>
    </div>
    <div class="tab-content">
        <div id="chat" class="tab-pane active">
            <div class="chat-box" id="chatBox"><div class="msg assistant">Hello!</div></div>
            <div class="chat-input">
                <input type="text" id="wiadomosc" placeholder="Type..." onkeydown="if(event.key==='Enter')send()">
                <button onclick="send()">Send</button>
            </div>
        </div>
        <div id="analiza" class="tab-pane">
            <div class="upload-area" onclick="document.getElementById('plik').click()">
                <div class="upload-icon">📁</div>
                <p><strong>Click to select CSV</strong></p>
                <input type="file" id="plik" accept=".csv" onchange="analyze()">
            </div>
            <div class="loading" id="loading"><div class="spinner"></div><p>Analyzing...</p></div>
            <div class="results" id="results">
                <h3>Results</h3>
                <div class="stats-grid" id="stats"></div>
                <div class="analysis-text" id="analysis"></div>
                <div id="download"></div>
            </div>
        </div>
    </div>
</div>

<script>
function openTab(name){
    document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById(name).classList.add('active');
    event.target.classList.add('active');
}

async function send(){
    const input=document.getElementById('wiadomosc');
    const msg=input.value.trim();
    if(!msg)return;
    const box=document.getElementById('chatBox');
    box.innerHTML+=`<div class="msg user">${msg}</div>`;
    input.value='';
    box.scrollTop=box.scrollHeight;
    const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const data=await res.json();
    box.innerHTML+=`<div class="msg assistant">${data.response||data.error}</div>`;
    box.scrollTop=box.scrollHeight;
}

async function analyze(){
    const file=document.getElementById('plik').files[0];
    if(!file)return;
    document.getElementById('loading').classList.add('show');
    document.getElementById('results').classList.remove('show');
    const fd=new FormData();
    fd.append('file',file);
    const res=await fetch('/analizuj',{method:'POST',body:fd});
    const data=await res.json();
    document.getElementById('loading').classList.remove('show');
    if(data.error){alert(data.error);return;}
    document.getElementById('results').classList.add('show');
    document.getElementById('stats').innerHTML=`
        <div class="stat-card"><div class="stat-number">${data.rows}</div><div>Rows</div></div>
        <div class="stat-card"><div class="stat-number">${data.columns}</div><div>Columns</div></div>`;
    document.getElementById('analysis').textContent=data.summary;
    document.getElementById('download').innerHTML=`<div style="margin-top:20px;text-align:center;"><a href="/pobierz/${data.report_file}" class="download-btn" download>Download HTML</a></div>`;
}
</script>
</body>
</html>
